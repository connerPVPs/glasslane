name: devlane
run-name: "shard-${{ inputs.owner }}-${{ inputs.name }}"

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Shards owner"
        required: true
        type: string
      name:
        description: "Shard subdomain prefix"
        required: true
        type: string
      shard_id:
        description: "Shard session id"
        required: false
        default: ""
        type: string
      software:
        description: "Server software (paper, leaf, purpur, pufferfish, folia, vanilla, fabric, spigot, velocity)"
        required: false
        default: "paper"
        type: string
      version:
        description: "Minecraft version"
        required: false
        default: "1.21.11"
        type: string
      build:
        description: "Software build"
        required: false
        default: "latest"
        type: string
      jar_url:
        description: "Optional explicit jar URL"
        required: false
        default: ""
        type: string
      api_url:
        description: "Shards control-plane base URL"
        required: false
        default: "https://shards.zealot.bond"
        type: string
      agent_token:
        description: "Short-lived per-shard sync token"
        required: false
        default: ""
        type: string
      duration_minutes:
        description: "Duration minutes (max 290)"
        required: false
        default: "290"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: glasslane-shard-${{ inputs.owner }}
  cancel-in-progress: true

jobs:
  lane:
    name: shard
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask token
        run: echo "::add-mask::${{ inputs.agent_token }}"

      - name: Run Shard Agent
        env:
          SHARD_OWNER: ${{ inputs.owner }}
          SHARD_NAME: ${{ inputs.name }}
          SHARD_ID: ${{ inputs.shard_id }}
          SHARD_SOFTWARE: ${{ inputs.software }}
          SHARD_VERSION: ${{ inputs.version }}
          SHARD_BUILD: ${{ inputs.build }}
          SHARD_JAR_URL: ${{ inputs.jar_url }}
          SHARDS_API_URL: ${{ inputs.api_url }}
          AGENT_TOKEN: ${{ inputs.agent_token }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/shard-agent.py
