name: devlane
run-name: "shard-${{ inputs.owner }}-${{ inputs.name }}"

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Shards owner (Discord user id)"
        required: true
        type: string
      name:
        description: "Shard subdomain prefix (<name>.zealot.bond)"
        required: true
        type: string
      shard_id:
        description: "Shard session id"
        required: false
        default: ""
        type: string
      api_url:
        description: "Shards control-plane base URL"
        required: false
        default: "https://shards.zealot.bond"
        type: string
      duration_minutes:
        description: "How long to keep the shard alive (max 290)"
        required: false
        default: "290"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: glasslane-shard-${{ inputs.owner }}
  cancel-in-progress: true

jobs:
  lane:
    name: shard
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Shard Agent
        env:
          SHARD_OWNER: ${{ inputs.owner }}
          SHARD_NAME: ${{ inputs.name }}
          SHARD_ID: ${{ inputs.shard_id }}
          SHARDS_API_URL: ${{ inputs.api_url }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/shard-agent.py
